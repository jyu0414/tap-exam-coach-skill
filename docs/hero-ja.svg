<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif">
<rect x="1" y="1" width="998" height="538" rx="24" fill="#F6F7FB" stroke="#E2E5EE"/>
<rect x="40" y="30" width="300" height="480" rx="40" fill="#1E2330"/>
<rect x="54" y="44" width="272" height="452" rx="30" fill="#FFFFFF"/>
<rect x="150" y="56" width="80" height="8" rx="4" fill="#D9DCE5"/>
<rect x="72" y="80" width="94" height="26" rx="13" fill="#EEF1FF"/>
<text x="84" y="98" font-size="13" font-weight="700" fill="#3A4BD8">問3/25</text>
<text x="72" y="136" font-size="14.5" font-weight="600" fill="#1E2330">保存データと転送中データの</text>
<text x="72" y="158" font-size="14.5" font-weight="600" fill="#1E2330">両方を保護したい。最も適切</text>
<text x="72" y="180" font-size="14.5" font-weight="600" fill="#1E2330">な組み合わせはどれか。</text>
<rect x="70" y="212" width="240" height="46" rx="12" fill="#EEF1FF" stroke="#3A4BD8" stroke-width="2"/>
<circle cx="94" cy="235" r="13" fill="#3A4BD8"/>
<text x="94" y="240" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">A</text>
<text x="114" y="240" font-size="12" fill="#1E2330">保存中はAES、転送中はTLS</text>
<rect x="70" y="270" width="240" height="46" rx="12" fill="#FFFFFF" stroke="#D9DCE5" stroke-width="1"/>
<circle cx="94" cy="293" r="13" fill="#F0F2F7"/>
<text x="94" y="298" font-size="13" font-weight="700" text-anchor="middle" fill="#4A5163">B</text>
<text x="114" y="298" font-size="12" fill="#1E2330">保存中はRSA、転送中はIPsec</text>
<rect x="70" y="328" width="240" height="46" rx="12" fill="#FFFFFF" stroke="#D9DCE5" stroke-width="1"/>
<circle cx="94" cy="351" r="13" fill="#F0F2F7"/>
<text x="94" y="356" font-size="13" font-weight="700" text-anchor="middle" fill="#4A5163">C</text>
<text x="114" y="356" font-size="12" fill="#1E2330">保存中はSHA-256、転送中はTLS</text>
<rect x="70" y="386" width="240" height="46" rx="12" fill="#FFFFFF" stroke="#D9DCE5" stroke-width="1"/>
<circle cx="94" cy="409" r="13" fill="#F0F2F7"/>
<text x="94" y="414" font-size="13" font-weight="700" text-anchor="middle" fill="#4A5163">D</text>
<text x="114" y="414" font-size="12" fill="#1E2330">保存中は3DES、転送中はSSH</text>
<circle cx="292" cy="240" r="16" fill="#3A4BD8" fill-opacity="0.18"/>
<circle cx="292" cy="240" r="7" fill="#3A4BD8" fill-opacity="0.55"/>
<text x="190" y="460" font-size="12.5" text-anchor="middle" fill="#6B7285">タップで回答</text>
<path d="M356 270 H392" stroke="#9AA2B8" stroke-width="3" stroke-linecap="round"/>
<path d="M384 260 L396 270 L384 280" fill="none" stroke="#9AA2B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="412" y="30" width="548" height="336" rx="18" fill="#FFFFFF" stroke="#E2E5EE"/>
<rect x="436" y="52" width="120" height="32" rx="16" fill="#E7F7EE"/>
<text x="496" y="73" font-size="15" font-weight="700" text-anchor="middle" fill="#167A45">正解　A</text>
<text x="572" y="73" font-size="13" fill="#6B7285">あなたの回答: A</text>
<rect x="436" y="100" width="4" height="16" rx="2" fill="#3A4BD8"/>
<text x="448" y="113" font-size="13.5" font-weight="700" fill="#1E2330">正解の理由</text>
<text x="448" y="136" font-size="13" fill="#4A5163">AESは大量データの暗号化に向く共通鍵暗号。</text>
<text x="448" y="157" font-size="13" fill="#4A5163">TLSは通信路を守る標準のプロトコル。</text>
<rect x="436" y="180" width="4" height="16" rx="2" fill="#3A4BD8"/>
<text x="448" y="193" font-size="13.5" font-weight="700" fill="#1E2330">他の選択肢が劣る理由</text>
<text x="448" y="216" font-size="13" fill="#4A5163">B: RSAは鍵交換・署名向きで大量データに不向き</text>
<text x="448" y="237" font-size="13" fill="#4A5163">C: SHA-256はハッシュ。暗号化ではない</text>
<text x="448" y="258" font-size="13" fill="#4A5163">D: 3DESは現在は非推奨</text>
<rect x="436" y="281" width="4" height="16" rx="2" fill="#3A4BD8"/>
<text x="448" y="294" font-size="13.5" font-weight="700" fill="#1E2330">試験の判断軸</text>
<text x="448" y="317" font-size="13" fill="#4A5163">方式の名前より「用途に合うか」で選ぶ</text>
<rect x="412" y="388" width="548" height="36" rx="18" fill="#FFFFFF" stroke="#E2E5EE"/>
<circle cx="434" cy="406" r="7" fill="#3A4BD8"/>
<path d="M430.5 406 l2.5 2.5 l4.5 -5" fill="none" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="452" y="411" font-size="13" fill="#1E2330">本番と同じ形式（ア〜エ・5択・複数選択・短答・図）</text>
<rect x="412" y="430" width="548" height="36" rx="18" fill="#FFFFFF" stroke="#E2E5EE"/>
<circle cx="434" cy="448" r="7" fill="#3A4BD8"/>
<path d="M430.5 448 l2.5 2.5 l4.5 -5" fill="none" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="452" y="453" font-size="13" fill="#1E2330">全小項目に問題を割り当てて網羅</text>
<rect x="412" y="472" width="548" height="36" rx="18" fill="#FFFFFF" stroke="#E2E5EE"/>
<circle cx="434" cy="490" r="7" fill="#3A4BD8"/>
<path d="M430.5 490 l2.5 2.5 l4.5 -5" fill="none" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="452" y="495" font-size="13" fill="#1E2330">記録して次の会話で続きから再開</text>
</svg>